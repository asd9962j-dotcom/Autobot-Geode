name: Build AutoBot
on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar fuentes
        shell: bash
        run: |
          echo "== Archivos en el repo =="
          ls -R . | grep -v -E "^./\.git" | head -60
          test -s src/main.cpp || { echo "ERROR: falta src/main.cpp o esta vacio"; exit 1; }
          grep -q "BotPauseLayer" src/main.cpp || { echo "ERROR: src/main.cpp no es el de AutoBot"; exit 1; }
          echo "main.cpp OK: $(wc -c < src/main.cpp) bytes"
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: AutoBot-geode
          path: ${{ steps.build.outputs.build-output }}
